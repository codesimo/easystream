<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cerca Film e Serie TV</title>
<style>
  :root{
    --bg:#0f1115;
    --bg-card:#171a21;
    --bg-card-hover:#1f232c;
    --border:#2a2f3a;
    --text:#e8eaed;
    --text-dim:#9aa0a8;
    --accent:#4da6ff;
    --accent-hover:#6bb6ff;
    --green:#2ecc71;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:24px 16px 80px;
  }
  .container{
    max-width:900px;
    margin:0 auto;
  }
  h1{
    text-align:center;
    font-size:1.8rem;
    margin-bottom:4px;
  }
  .subtitle{
    text-align:center;
    color:var(--text-dim);
    margin-bottom:28px;
    font-size:0.95rem;
  }
  .search-wrap{
    position:relative;
    margin-bottom:28px;
  }
  #searchInput{
    width:100%;
    padding:14px 44px 14px 16px;
    font-size:1.05rem;
    border-radius:var(--radius);
    border:1px solid var(--border);
    background:var(--bg-card);
    color:var(--text);
    outline:none;
    transition:border-color .15s;
  }
  #searchInput:focus{
    border-color:var(--accent);
  }
  .spinner{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    width:18px;
    height:18px;
    border:2px solid var(--border);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin .7s linear infinite;
    display:none;
  }
  .spinner.active{display:block;}
  @keyframes spin{to{transform:translateY(-50%) rotate(360deg);}}

  .section-title{
    font-size:0.85rem;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--text-dim);
    margin:18px 0 10px;
  }
  .results-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(180px,1fr));
    gap:14px;
  }
  .card{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
    cursor:pointer;
    transition:transform .12s, background .12s, border-color .12s;
    display:flex;
    flex-direction:column;
  }
  .card:hover{
    background:var(--bg-card-hover);
    transform:translateY(-2px);
    border-color:var(--accent);
  }
  .card .poster{
    width:100%;
    aspect-ratio:2/3;
    background:#0b0d11 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="150"><rect width="100" height="150" fill="%23171a21"/></svg>') center/cover;
    object-fit:cover;
    display:block;
  }
  .card .info{
    padding:8px 10px 10px;
    flex:1;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .card .title{
    font-size:0.9rem;
    font-weight:600;
    line-height:1.25;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .card .meta{
    font-size:0.75rem;
    color:var(--text-dim);
  }
  .empty-msg{
    color:var(--text-dim);
    text-align:center;
    padding:30px 10px;
    font-size:0.95rem;
  }

  /* Detail / season / episode panel */
  .panel{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
    margin-top:10px;
  }
  .panel-header{
    display:flex;
    gap:16px;
    align-items:flex-start;
    margin-bottom:16px;
  }
  .panel-header img{
    width:90px;
    border-radius:8px;
    flex-shrink:0;
  }
  .panel-header h2{
    margin:0 0 6px;
    font-size:1.3rem;
  }
  .panel-header p{
    margin:0;
    color:var(--text-dim);
    font-size:0.85rem;
    line-height:1.4;
  }
  .back-btn{
    background:none;
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:6px 12px;
    border-radius:8px;
    cursor:pointer;
    font-size:0.85rem;
    margin-bottom:14px;
  }
  .back-btn:hover{
    border-color:var(--accent);
    color:var(--accent);
  }

  select{
    width:100%;
    padding:10px 12px;
    font-size:0.95rem;
    border-radius:8px;
    border:1px solid var(--border);
    background:#0f1115;
    color:var(--text);
    margin-bottom:14px;
    outline:none;
  }
  select:focus{border-color:var(--accent);}

  label{
    font-size:0.8rem;
    color:var(--text-dim);
    display:block;
    margin-bottom:6px;
  }

  .episode-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    max-height:420px;
    overflow-y:auto;
    padding-right:4px;
  }
  .episode-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:8px;
    background:#0f1115;
    cursor:pointer;
    transition:border-color .12s, background .12s;
  }
  .episode-item:hover{
    border-color:var(--accent);
    background:#12151b;
  }
  .episode-item .ep-num{
    color:var(--accent);
    font-weight:700;
    font-size:0.85rem;
    flex-shrink:0;
    width:34px;
  }
  .episode-item .ep-name{
    flex:1;
    font-size:0.9rem;
  }
  .episode-item .ep-arrow{
    color:var(--text-dim);
    font-size:0.85rem;
  }

  .link-box{
    margin-top:16px;
    padding:16px;
    border:1px solid var(--green);
    border-radius:8px;
    background:rgba(46,204,113,0.07);
  }
  .link-box a{
    color:var(--green);
    word-break:break-all;
    font-size:0.95rem;
    text-decoration:none;
    font-weight:600;
  }
  .link-box a:hover{
    text-decoration:underline;
  }
  .link-box .copy-btn{
    display:inline-block;
    margin-top:10px;
    background:var(--green);
    color:#0f1115;
    border:none;
    padding:8px 14px;
    border-radius:6px;
    font-weight:600;
    font-size:0.82rem;
    cursor:pointer;
  }
  .link-box .copy-btn:hover{opacity:.9;}

  .api-warning{
    background:rgba(255,159,26,0.1);
    border:1px solid #ff9f1a;
    color:#ffb84d;
    padding:12px 16px;
    border-radius:8px;
    font-size:0.85rem;
    margin-bottom:20px;
    display:none;
  }
  .api-warning.show{display:block;}

  footer{
    text-align:center;
    color:var(--text-dim);
    font-size:0.75rem;
    margin-top:50px;
  }

  /* Password unlock modal */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(6,7,9,0.85);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:16px;
  }
  .modal-box{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:28px;
    max-width:380px;
    width:100%;
    text-align:center;
  }
  .modal-box h2{
    margin:0 0 8px;
    font-size:1.2rem;
  }
  .modal-box p{
    color:var(--text-dim);
    font-size:0.85rem;
    margin:0 0 18px;
    line-height:1.4;
  }
  .modal-box input[type="password"]{
    width:100%;
    padding:12px 14px;
    font-size:1rem;
    border-radius:8px;
    border:1px solid var(--border);
    background:#0f1115;
    color:var(--text);
    outline:none;
    margin-bottom:12px;
    text-align:center;
  }
  .modal-box input[type="password"]:focus{
    border-color:var(--accent);
  }
  .modal-box button{
    width:100%;
    padding:12px;
    font-size:0.95rem;
    font-weight:600;
    border-radius:8px;
    border:none;
    background:var(--accent);
    color:#0b0d11;
    cursor:pointer;
  }
  .modal-box button:hover{
    background:var(--accent-hover);
  }
  .modal-box button:disabled{
    opacity:0.6;
    cursor:not-allowed;
  }
  .modal-error{
    color:#ff6b6b;
    font-size:0.82rem;
    margin-top:10px;
    min-height:1.2em;
  }
  body.locked > .container,
  body.locked > footer{
    display:none;
  }
</style>
</head>
<body class="locked">

<div class="modal-overlay" id="unlockModal">
  <div class="modal-box">
    <h2>🔒 Sito protetto</h2>
    <p>Inserisci la password per sbloccare l'accesso alla ricerca.</p>
    <input type="password" id="unlockPassword" placeholder="Password" autocomplete="off">
    <button id="unlockBtn">Sblocca</button>
    <div class="modal-error" id="unlockError"></div>
  </div>
</div>

<div class="container">
  <h1>🎬 Cerca Film e Serie TV</h1>
  <p class="subtitle">Digita un titolo per cercare su TMDB, poi genera il link di riproduzione</p>

  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Es. Breaking Bad, Inception, La casa di carta..." autocomplete="off">
    <div class="spinner" id="spinner"></div>
  </div>

  <div id="resultsArea"></div>
  <div id="detailArea"></div>
</div>

<footer>
  Dati forniti da TMDB · Riproduzione tramite vixsrc.to
  <br>
  <button id="lockBtn" style="margin-top:10px;background:none;border:1px solid var(--border);color:var(--text-dim);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:0.75rem;">🔒 Blocca sito</button>
</footer>

<script>
/* ============================================================
   CONFIGURAZIONE
   ============================================================ */
let TMDB_API_KEY = null; // in realtà è il Read Access Token (v4 auth), usato come Bearer token; popolato solo dopo lo sblocco con password (mai in chiaro nel sorgente)
const ENCRYPTED_KEY_FILE = "encrypted-key.json"; // generato dalla GitHub Action, contiene ciphertext/salt/iv (dati pubblici, inutili senza password)
const TMDB_BASE = "https://api.themoviedb.org/3";
const IMG_BASE = "https://image.tmdb.org/t/p/w200";
const LANGUAGE = "it-IT";
const VIXSRC_BASE = "https://vixsrc.to";

const DEBOUNCE_MS = 400;
const MAX_RESULTS_PER_TYPE = 5;
const PBKDF2_ITERATIONS = 300000; // deve combaciare con quanto usato dallo script di cifratura
const SESSION_STORAGE_KEY = "tmdb_decrypted_key"; // solo sessionStorage: sparisce alla chiusura della scheda

/* ============================================================
   STATE / ELEMENTS
   ============================================================ */
const searchInput = document.getElementById("searchInput");
const spinner = document.getElementById("spinner");
const resultsArea = document.getElementById("resultsArea");
const detailArea = document.getElementById("detailArea");

const unlockModal = document.getElementById("unlockModal");
const unlockPassword = document.getElementById("unlockPassword");
const unlockBtn = document.getElementById("unlockBtn");
const unlockError = document.getElementById("unlockError");

let debounceTimer = null;
let currentRequestId = 0;

/* ============================================================
   SBLOCCO CON PASSWORD (Web Crypto: PBKDF2 -> AES-GCM)
   ============================================================ */
function base64ToBytes(b64) {
  return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
}

async function deriveAesKey(password, saltBytes) {
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey(
    "raw",
    enc.encode(password),
    "PBKDF2",
    false,
    ["deriveKey"]
  );
  return crypto.subtle.deriveKey(
    {
      name: "PBKDF2",
      salt: saltBytes,
      iterations: PBKDF2_ITERATIONS,
      hash: "SHA-256"
    },
    baseKey,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
}

async function tryUnlock(password) {
  unlockBtn.disabled = true;
  unlockError.textContent = "";

  try {
    const res = await fetch(ENCRYPTED_KEY_FILE, { cache: "no-store" });
    if (!res.ok) {
      throw new Error("Impossibile caricare " + ENCRYPTED_KEY_FILE);
    }
    const payload = await res.json();

    const salt = base64ToBytes(payload.salt);
    const iv = base64ToBytes(payload.iv);
    const ciphertext = base64ToBytes(payload.ciphertext);

    const aesKey = await deriveAesKey(password, salt);

    const decryptedBuf = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: iv },
      aesKey,
      ciphertext
    );

    const decoded = new TextDecoder().decode(decryptedBuf);

    // successo: AES-GCM verifica l'integrità, quindi se arriviamo qui la password era corretta
    TMDB_API_KEY = decoded;

    // ricorda la key SOLO per questa scheda/sessione del browser (sparisce alla chiusura),
    // così non serve reinserire la password ad ogni reload della pagina
    try {
      sessionStorage.setItem(SESSION_STORAGE_KEY, decoded);
    } catch (storageErr) {
      // se sessionStorage non è disponibile (es. modalità privata restrittiva), si procede comunque:
      // semplicemente al prossimo reload verrà richiesta di nuovo la password
      console.warn("sessionStorage non disponibile:", storageErr);
    }

    unlockUI();
  } catch (err) {
    // password sbagliata -> AES-GCM lancia un errore in fase di decrypt (tag di autenticazione non valido)
    unlockError.textContent = "Password errata, riprova.";
    unlockBtn.disabled = false;
  }
}

function unlockUI() {
  document.body.classList.remove("locked");
  if (unlockModal.isConnected) unlockModal.remove();
}

// All'avvio: se una key era già stata decifrata in questa sessione del browser, saltiamo la richiesta password
(function restoreFromSession() {
  try {
    const cached = sessionStorage.getItem(SESSION_STORAGE_KEY);
    if (cached) {
      TMDB_API_KEY = cached;
      unlockUI();
    }
  } catch (storageErr) {
    // sessionStorage non disponibile: si procede normalmente chiedendo la password
  }
})();

unlockBtn.addEventListener("click", () => {
  const pw = unlockPassword.value;
  if (!pw) {
    unlockError.textContent = "Inserisci una password.";
    return;
  }
  tryUnlock(pw);
});

unlockPassword.addEventListener("keydown", (e) => {
  if (e.key === "Enter") unlockBtn.click();
});

const lockBtn = document.getElementById("lockBtn");
if (lockBtn) {
  lockBtn.addEventListener("click", () => {
    try {
      sessionStorage.removeItem(SESSION_STORAGE_KEY);
    } catch (storageErr) {
      // ignorabile: peggio che va, la key resta in memoria fino al reload
    }
    location.reload();
  });
}

/* ============================================================
   SEARCH INPUT HANDLER (debounced live search)
   ============================================================ */
searchInput.addEventListener("input", () => {
  const query = searchInput.value.trim();
  clearTimeout(debounceTimer);

  // clear detail view when starting a new search
  detailArea.innerHTML = "";

  if (query.length === 0) {
    resultsArea.innerHTML = "";
    spinner.classList.remove("active");
    return;
  }

  spinner.classList.add("active");
  debounceTimer = setTimeout(() => {
    performSearch(query);
  }, DEBOUNCE_MS);
});

/* ============================================================
   PERFORM SEARCH (movie + tv in parallel)
   ============================================================ */
async function performSearch(query) {
  const requestId = ++currentRequestId;

  try {
    const [movieData, tvData] = await Promise.all([
      fetchTMDB("/search/movie", { query }),
      fetchTMDB("/search/tv", { query })
    ]);

    // ignore stale responses if a newer search has started
    if (requestId !== currentRequestId) return;

    const movies = (movieData?.results || []).slice(0, MAX_RESULTS_PER_TYPE);
    const tvShows = (tvData?.results || []).slice(0, MAX_RESULTS_PER_TYPE);

    renderResults(movies, tvShows);
  } catch (err) {
    if (requestId !== currentRequestId) return;
    console.error(err);
    resultsArea.innerHTML = `<p class="empty-msg">Errore durante la ricerca. Controlla la API Key o la connessione.</p>`;
  } finally {
    if (requestId === currentRequestId) {
      spinner.classList.remove("active");
    }
  }
}

/* ============================================================
   TMDB FETCH HELPER
   ============================================================ */
async function fetchTMDB(path, params = {}) {
  const url = new URL(TMDB_BASE + path);
  url.searchParams.set("language", LANGUAGE);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));

  const res = await fetch(url.toString(), {
    headers: {
      "Authorization": `Bearer ${TMDB_API_KEY}`,
      "Content-Type": "application/json;charset=utf-8"
    }
  });
  if (!res.ok) {
    throw new Error(`TMDB request failed: ${res.status} ${res.statusText}`);
  }
  return res.json();
}

/* ============================================================
   RENDER: SEARCH RESULTS
   ============================================================ */
function renderResults(movies, tvShows) {
  if (movies.length === 0 && tvShows.length === 0) {
    resultsArea.innerHTML = `<p class="empty-msg">Nessun risultato trovato.</p>`;
    return;
  }

  let html = "";

  if (movies.length > 0) {
    html += `<div class="section-title">Film</div><div class="results-grid">`;
    html += movies.map(m => cardHTML({
      id: m.id,
      title: m.title || m.original_title,
      date: m.release_date,
      poster: m.poster_path,
      type: "movie"
    })).join("");
    html += `</div>`;
  }

  if (tvShows.length > 0) {
    html += `<div class="section-title">Serie TV</div><div class="results-grid">`;
    html += tvShows.map(t => cardHTML({
      id: t.id,
      title: t.name || t.original_name,
      date: t.first_air_date,
      poster: t.poster_path,
      type: "tv"
    })).join("");
    html += `</div>`;
  }

  resultsArea.innerHTML = html;

  // attach click handlers
  resultsArea.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", () => {
      const id = card.dataset.id;
      const type = card.dataset.type;
      const title = card.dataset.title;
      if (type === "movie") {
        selectMovie(id, title);
      } else {
        selectTVShow(id, title);
      }
    });
  });
}

function cardHTML({ id, title, date, poster, type }) {
  const year = date ? date.split("-")[0] : "N/D";
  const posterUrl = poster ? IMG_BASE + poster : "";
  const posterStyle = posterUrl ? `style="background-image:url('${posterUrl}');background-size:cover;background-position:center;"` : "";
  return `
    <div class="card" data-id="${id}" data-type="${type}" data-title="${escapeHTML(title)}">
      <div class="poster" ${posterStyle}></div>
      <div class="info">
        <div class="title">${escapeHTML(title)}</div>
        <div class="meta">${year}</div>
      </div>
    </div>
  `;
}

/* ============================================================
   MOVIE SELECTED -> direttamente il link
   ============================================================ */
function selectMovie(id, title) {
  const link = `${VIXSRC_BASE}/movie/${id}?language=${LANGUAGE}`;
  detailArea.innerHTML = `
    <button class="back-btn" id="backBtn">← Torna alla ricerca</button>
    <div class="panel">
      <div class="panel-header">
        <h2>${escapeHTML(title)}</h2>
      </div>
      ${linkBoxHTML(link)}
    </div>
  `;
  attachDetailListeners(link);
}

/* ============================================================
   TV SHOW SELECTED -> carica le stagioni
   ============================================================ */
async function selectTVShow(id, title) {
  detailArea.innerHTML = `<p class="empty-msg">Caricamento stagioni...</p>`;
  try {
    const details = await fetchTMDB(`/tv/${id}`);
    const seasons = (details.seasons || []).filter(s => s.season_number !== undefined);

    const posterUrl = details.poster_path ? IMG_BASE + details.poster_path : "";

    detailArea.innerHTML = `
      <button class="back-btn" id="backBtn">← Torna alla ricerca</button>
      <div class="panel">
        <div class="panel-header">
          ${posterUrl ? `<img src="${posterUrl}" alt="">` : ""}
          <div>
            <h2>${escapeHTML(title)}</h2>
            <p>${escapeHTML(details.overview || "")}</p>
          </div>
        </div>
        <label for="seasonSelect">Seleziona stagione</label>
        <select id="seasonSelect">
          <option value="">-- Scegli una stagione --</option>
          ${seasons.map(s => `<option value="${s.season_number}">${escapeHTML(s.name)} (${s.episode_count} episodi)</option>`).join("")}
        </select>
        <div id="episodeArea"></div>
      </div>
    `;

    document.getElementById("backBtn").addEventListener("click", () => {
      detailArea.innerHTML = "";
    });

    document.getElementById("seasonSelect").addEventListener("change", (e) => {
      const seasonNumber = e.target.value;
      if (seasonNumber === "") {
        document.getElementById("episodeArea").innerHTML = "";
        return;
      }
      loadSeasonEpisodes(id, title, seasonNumber);
    });

  } catch (err) {
    console.error(err);
    detailArea.innerHTML = `
      <button class="back-btn" id="backBtn">← Torna alla ricerca</button>
      <p class="empty-msg">Errore nel caricamento dei dettagli della serie.</p>
    `;
    document.getElementById("backBtn").addEventListener("click", () => {
      detailArea.innerHTML = "";
    });
  }
}

/* ============================================================
   LOAD EPISODES FOR A GIVEN SEASON
   ============================================================ */
async function loadSeasonEpisodes(tvId, tvTitle, seasonNumber) {
  const episodeArea = document.getElementById("episodeArea");
  episodeArea.innerHTML = `<p class="empty-msg">Caricamento episodi...</p>`;

  try {
    const seasonData = await fetchTMDB(`/tv/${tvId}/season/${seasonNumber}`);
    const episodes = seasonData.episodes || [];

    if (episodes.length === 0) {
      episodeArea.innerHTML = `<p class="empty-msg">Nessun episodio trovato per questa stagione.</p>`;
      return;
    }

    episodeArea.innerHTML = `
      <label>Seleziona episodio</label>
      <div class="episode-list">
        ${episodes.map(ep => `
          <div class="episode-item" data-episode="${ep.episode_number}">
            <span class="ep-num">E${String(ep.episode_number).padStart(2, "0")}</span>
            <span class="ep-name">${escapeHTML(ep.name || "Senza titolo")}</span>
            <span class="ep-arrow">→</span>
          </div>
        `).join("")}
      </div>
      <div id="episodeLinkArea"></div>
    `;

    episodeArea.querySelectorAll(".episode-item").forEach(item => {
      item.addEventListener("click", () => {
        const episodeNumber = item.dataset.episode;
        const link = `${VIXSRC_BASE}/tv/${tvId}/${seasonNumber}/${episodeNumber}?language=${LANGUAGE}`;
        const linkAreaEl = document.getElementById("episodeLinkArea");
        linkAreaEl.innerHTML = linkBoxHTML(link);
        attachCopyListener(link, linkAreaEl);
        linkAreaEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });
    });

  } catch (err) {
    console.error(err);
    episodeArea.innerHTML = `<p class="empty-msg">Errore nel caricamento degli episodi.</p>`;
  }
}

/* ============================================================
   LINK BOX + COPY UTILS
   ============================================================ */
function linkBoxHTML(link) {
  return `
    <div class="link-box">
      <a href="${link}" target="_blank" rel="noopener noreferrer">${link}</a>
      <br>
      <button class="copy-btn">📋 Copia link</button>
    </div>
  `;
}

function attachDetailListeners(link) {
  document.getElementById("backBtn").addEventListener("click", () => {
    detailArea.innerHTML = "";
  });
  attachCopyListener(link, detailArea);
}

function attachCopyListener(link, container) {
  const btn = container.querySelector(".copy-btn");
  if (!btn) return;
  btn.addEventListener("click", () => {
    navigator.clipboard.writeText(link).then(() => {
      btn.textContent = "✓ Copiato!";
      setTimeout(() => { btn.textContent = "📋 Copia link"; }, 1500);
    });
  });
}

/* ============================================================
   UTILS
   ============================================================ */
function escapeHTML(str) {
  if (!str) return "";
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
</script>
