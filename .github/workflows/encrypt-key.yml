name: Genera chiave TMDB cifrata

# Avviabile solo manualmente da: tab "Actions" -> questo workflow -> "Run workflow"
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Genera encrypted-key.json
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          ENCRYPT_PASSWORD: ${{ secrets.ENCRYPT_PASSWORD }}
        run: node scripts/encrypt-key.js

      - name: Commit e push del file cifrato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add encrypted-key.json
          git diff --staged --quiet && echo "Nessuna modifica da committare" || git commit -m "chore: rigenera encrypted-key.json"
          git push
